plugins {
    id "com.android.application"
}

android {
    namespace "uk.yayoi.magpiemonitor"
    compileSdk 34

    defaultConfig {
        applicationId "uk.yayoi.magpiemonitor"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        debug {
            applicationIdSuffix ""
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt")
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
