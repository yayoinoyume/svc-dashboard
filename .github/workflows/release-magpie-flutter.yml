name: Release Magpie Flutter APK

# 推一个 v 开头的标签即可发布：
#   git tag v1.5.0 && git push origin v1.5.0
# 也可以在 Actions 页面手动触发（填入已存在的标签）。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要重新发布的标签（例如 v1.5.0）"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Load signing material
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          KEYSTORE_B64: op://Magpie/magpie-signing/base64
          KEYSTORE_PASSWORD: op://Magpie/magpie-signing/password
          KEY_ALIAS: op://Magpie/magpie-signing/alias
          KEY_PASSWORD: op://Magpie/magpie-signing/key_password

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare host project
        run: |
          flutter create --org uk.yayoi --project-name magpie_flutter --platforms=android /tmp/magpie_host
          rm -rf /tmp/magpie_host/lib /tmp/magpie_host/test
          cp -r flutter_app/lib /tmp/magpie_host/lib
          cp flutter_app/pubspec.yaml /tmp/magpie_host/pubspec.yaml
          cp flutter_app/analysis_options.yaml /tmp/magpie_host/analysis_options.yaml
          sed -i 's/android:label="magpie_flutter"/android:label="Magpie Flutter"/' /tmp/magpie_host/android/app/src/main/AndroidManifest.xml
          # release 清单默认没有网络权限（只有 debug/profile 清单带），必须显式补上
          sed -i '/<application/i\    <uses-permission android:name="android.permission.INTERNET"/>' /tmp/magpie_host/android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' /tmp/magpie_host/android/app/src/main/AndroidManifest.xml || { echo '缺少 INTERNET 权限'; exit 1; }
          # 用 1Password 里的正式签名密钥，不再使用仓库内的 debug keystore
          echo "$KEYSTORE_B64" | base64 -d > /tmp/magpie-release.p12
          python3 .github/scripts/configure-signing.py /tmp/magpie_host

      - name: Stamp version
        working-directory: /tmp/magpie_host
        run: |
          # versionName 跟标签一致，versionCode 用递增的构建号，保证能覆盖升级
          sed -i "s/^version: .*/version: ${{ steps.ver.outputs.version }}+${{ github.run_number }}/" pubspec.yaml
          grep '^version:' pubspec.yaml

      - name: Install dependencies
        working-directory: /tmp/magpie_host
        run: flutter pub get

      - name: Analyze
        working-directory: /tmp/magpie_host
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build release APK
        working-directory: /tmp/magpie_host
        run: flutter build apk --release --split-per-abi

      - name: Collect APKs
        run: |
          # 文件名保持固定，方便用 releases/latest/download/... 的永久链接
          cp /tmp/magpie_host/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk magpie-flutter-arm64.apk
          cp /tmp/magpie_host/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk magpie-flutter-armv7.apk
          ls -lh magpie-flutter-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          NOTES_FILE=/tmp/release-notes.md

          # 重跑时先删掉旧 release（标签保留）
          gh release delete "$TAG" --yes 2>/dev/null || true

          # 发布说明取标签注释；发版时写什么，这里就发什么
          if git tag -l --format='%(contents)' "$TAG" > "$NOTES_FILE" && [ -s "$NOTES_FILE" ]; then
            echo "使用标签注释作为发布说明"
          else
            echo "标签没有注释，使用默认说明"
            printf '版本 %s（构建 %s）\n' "$VERSION" "$GITHUB_RUN_NUMBER" > "$NOTES_FILE"
          fi

          printf '\n---\n\n**安装**：下载 `magpie-flutter-arm64.apk` 覆盖安装；老 32 位机型用 `magpie-flutter-armv7.apk`。首次打开需填写网关地址和访问密钥，密钥只保存在本机。\n' >> "$NOTES_FILE"

          gh release create "$TAG" \
            magpie-flutter-arm64.apk \
            magpie-flutter-armv7.apk \
            --title "Magpie Flutter ${VERSION}" \
            --notes-file "$NOTES_FILE" \
            --latest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: magpie-flutter-release
          path: |
            magpie-flutter-arm64.apk
            magpie-flutter-armv7.apk
          if-no-files-found: error
          retention-days: 90
