name: Build Magpie Monitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - magpie-monitor-app
    paths:
      - "android/**"
      - ".github/workflows/build-magpie-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" > /dev/null
          yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk magpie-monitor-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magpie-monitor-apk
          path: magpie-monitor-debug.apk
          if-no-files-found: error
          retention-days: 30
