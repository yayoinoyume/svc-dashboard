name: Build Magpie Monitor APK

on:
  workflow_dispatch:
  push:
    branches:
      - magpie-monitor-app
    paths:
      - "android/**"
      - ".github/workflows/build-magpie-apk.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install SDK packages
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          echo "Using $SDKMANAGER (ANDROID_HOME=$ANDROID_HOME)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Prepare signing key
        run: |
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon --stacktrace

      - name: Copy APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk magpie-monitor-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magpie-monitor-apk
          path: magpie-monitor-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signing key
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: android/debug.keystore
          retention-days: 1
